databaseChangeLog:
  - changeSet:
      id: 001-create-conversations
      author: tutorial
      changes:
        - sql:
            sql: |
              CREATE TABLE conversations (
                  id uuid PRIMARY KEY,
                  created_at timestamptz NOT NULL DEFAULT now(),
                  closed_at timestamptz
              );
  - changeSet:
      id: 002-create-spring-ai-chat-memory
      author: tutorial
      changes:
        - sql:
            sql: |
              CREATE TABLE SPRING_AI_CHAT_MEMORY (
                  conversation_id VARCHAR(36) NOT NULL,
                  content TEXT NOT NULL,
                  type VARCHAR(10) NOT NULL CHECK (type IN ('USER', 'ASSISTANT', 'SYSTEM', 'TOOL')),
                  "timestamp" TIMESTAMP NOT NULL,
                  sequence_id BIGINT NOT NULL
              );
              CREATE INDEX SPRING_AI_CHAT_MEMORY_CONVERSATION_ID_TIMESTAMP_IDX
              ON SPRING_AI_CHAT_MEMORY(conversation_id, "timestamp");
              CREATE INDEX SPRING_AI_CHAT_MEMORY_CONVERSATION_ID_SEQUENCE_ID_IDX
              ON SPRING_AI_CHAT_MEMORY(conversation_id, sequence_id);
  - changeSet:
      id: 003-conversation-usage-totals
      author: tutorial
      changes:
        - sql:
            sql: |
              ALTER TABLE conversations ADD COLUMN prompt_tokens BIGINT NOT NULL DEFAULT 0;
              ALTER TABLE conversations ADD COLUMN completion_tokens BIGINT NOT NULL DEFAULT 0;
  - changeSet:
      id: 004-conversation-summary
      author: tutorial
      changes:
        - sql:
            sql: |
              ALTER TABLE conversations ADD COLUMN summary TEXT;
              ALTER TABLE conversations ADD COLUMN summary_message_count INTEGER NOT NULL DEFAULT 0;
  - changeSet:
      id: 005-conversation-summary-usage
      author: tutorial
      changes:
        - sql:
            sql: |
              ALTER TABLE conversations ADD COLUMN summary_prompt_tokens BIGINT NOT NULL DEFAULT 0;
              ALTER TABLE conversations ADD COLUMN summary_completion_tokens BIGINT NOT NULL DEFAULT 0;
  - changeSet:
      id: 006-conversation-branching
      author: tutorial
      changes:
        - sql:
            sql: |
              ALTER TABLE conversations ADD COLUMN branch_of uuid;
              ALTER TABLE conversations ADD COLUMN branch_point INTEGER;
  - changeSet:
      id: 007-conversation-strategy-facts
      author: tutorial
      changes:
        - sql:
            sql: |
              ALTER TABLE conversations ADD COLUMN strategy VARCHAR(16) NOT NULL DEFAULT 'FULL';
              ALTER TABLE conversations ADD COLUMN facts TEXT;
              ALTER TABLE conversations ADD COLUMN facts_prompt_tokens BIGINT NOT NULL DEFAULT 0;
              ALTER TABLE conversations ADD COLUMN facts_completion_tokens BIGINT NOT NULL DEFAULT 0;
