<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
	<meta charset="UTF-8">
	<title>AI Challenge — Week 2: чат-агент</title>
	<style>
		body { font-family: sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
		h1 { font-size: 1.3em; }
		.cid { color: #888; font-size: 0.85em; margin: 4px 0; }
		.newchat { margin: 0 0 12px; }
		.newchat button { display: inline-block; margin: 0; padding: 4px 14px; font-size: 0.9em; }
		.chat { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; padding: 8px; background: #fafafa; border: 1px solid #ddd; border-radius: 8px; }
		.msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
		.user { align-self: flex-end; background: #d8e8ff; }
		.assistant { align-self: flex-start; background: #ececec; }
		.empty { color: #888; }
		input { width: 100%; box-sizing: border-box; font: inherit; }
		button { display: block; margin-top: 8px; padding: 8px 24px; }
		.error { background: #f8e8e8; color: #902020; padding: 10px 14px; border-radius: 8px; margin-top: 8px; }
	</style>
</head>
<body>
	<h1>Чат с агентом (DeepSeek)</h1>
	<p class="cid">id беседы: <code th:text="${conversationId}"></code></p>
	<form method="post" action="/chat/new" class="newchat">
		<button type="submit">Новый чат</button>
	</form>
	<div class="chat" th:if="${!messages.isEmpty()}">
		<div th:each="m : ${messages}" th:class="${m.fromUser} ? 'msg user' : 'msg assistant'">
			<div th:text="${m.text}"></div>
		</div>
	</div>
	<p class="empty" th:if="${messages.isEmpty()}">Сообщений пока нет — напишите что-нибудь ниже.</p>
	<form method="post" action="/chat">
		<input type="text" name="message" placeholder="Введите сообщение..." required autofocus>
		<button type="submit">Отправить</button>
	</form>
	<div th:if="${error}" class="error" th:text="${error}"></div>
</body>
</html>
