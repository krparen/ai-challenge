databaseChangeLog:
  - changeSet:
      id: 001-create-doc-chunks
      author: tutorial
      changes:
        - sql:
            sql: |
              CREATE TABLE doc_chunks (
                  id bigserial PRIMARY KEY,
                  strategy VARCHAR(16) NOT NULL,
                  source VARCHAR(256) NOT NULL,
                  title VARCHAR(256) NOT NULL,
                  section VARCHAR(512),
                  chunk_id INT NOT NULL,
                  content TEXT NOT NULL,
                  embedding JSONB NOT NULL,
                  created_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_doc_chunks_strategy ON doc_chunks (strategy);
  - changeSet:
      id: 002-create-spring-ai-chat-memory
      author: tutorial
      changes:
        - sql:
            sql: |
              CREATE TABLE SPRING_AI_CHAT_MEMORY (
                  conversation_id VARCHAR(36) NOT NULL,
                  content TEXT NOT NULL,
                  type VARCHAR(10) NOT NULL CHECK (type IN ('USER', 'ASSISTANT', 'SYSTEM', 'TOOL')),
                  "timestamp" TIMESTAMP NOT NULL,
                  sequence_id BIGINT NOT NULL
              );
              CREATE INDEX SPRING_AI_CHAT_MEMORY_CONVERSATION_ID_TIMESTAMP_IDX
              ON SPRING_AI_CHAT_MEMORY(conversation_id, "timestamp");
              CREATE INDEX SPRING_AI_CHAT_MEMORY_CONVERSATION_ID_SEQUENCE_ID_IDX
              ON SPRING_AI_CHAT_MEMORY(conversation_id, sequence_id);
  - changeSet:
      id: 003-create-chat-message-sources
      author: tutorial
      changes:
        - sql:
            sql: |
              CREATE TABLE chat_message_sources (
                  id bigserial PRIMARY KEY,
                  conversation_id VARCHAR(36) NOT NULL,
                  message_index INT NOT NULL,
                  source VARCHAR(256) NOT NULL,
                  section VARCHAR(512),
                  chunk_id INT NOT NULL
              );
              CREATE INDEX idx_chat_message_sources ON chat_message_sources (conversation_id, message_index);
